<meta charset="utf-8">
<title>Mesa de Revisão POF</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --ground: #EEF2F0;
  --surface: #FBFCFB;
  --surface-2: #E2E9E5;
  --ink: #17201D;
  --ink-2: #4D5A56;
  --rule: #C9D3CE;
  --accent: #0D6E64;
  --accent-ink: #FFFFFF;
  --accent-soft: #D2E7E2;
  --ok: #2F7A4B;   --ok-soft: #DBEEE1;
  --bad: #B0321F;  --bad-soft: #F5DDD8;
  --mod: #8A6100;  --mod-soft: #F3E6C6;
  --wait: #5B6770; --wait-soft: #E0E5E9;
  --lift: 0 1px 2px rgb(23 32 29 / .06), 0 6px 20px rgb(23 32 29 / .07);
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --top-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1513; --surface: #161E1B; --surface-2: #202A26; --ink: #E1E9E5; --ink-2: #9DAEA8;
    --rule: #2F3C37; --accent: #52B5A7; --accent-ink: #06201C; --accent-soft: #173A35;
    --ok: #72C28F; --ok-soft: #173424; --bad: #F0907E; --bad-soft: #3B1E19;
    --mod: #E1B75C; --mod-soft: #362A12; --wait: #A8B4BD; --wait-soft: #252D32;
    --lift: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F1513; --surface: #161E1B; --surface-2: #202A26; --ink: #E1E9E5; --ink-2: #9DAEA8;
  --rule: #2F3C37; --accent: #52B5A7; --accent-ink: #06201C; --accent-soft: #173A35;
  --ok: #72C28F; --ok-soft: #173424; --bad: #F0907E; --bad-soft: #3B1E19;
  --mod: #E1B75C; --mod-soft: #362A12; --wait: #A8B4BD; --wait-soft: #252D32;
  --lift: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--f-sans); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.label { font: 600 12px/1.2 var(--f-cond); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- barra superior */
.top {
  position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 16px;
}
.brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand strong { font: 600 19px/1.1 var(--f-cond); letter-spacing: .01em; }
.brand .mono { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.progresso { flex: 1 1 220px; display: flex; flex-direction: column; gap: 5px; min-width: 180px; }
.barra { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.barra span { display: block; height: 100%; }
.contagem { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.contagem b { color: var(--ink); font-weight: 600; }
.ferramentas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.campo { display: flex; align-items: center; gap: 6px; }
.campo input, .campo select {
  background: var(--ground); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 8px; min-width: 0;
}
#revisor { width: 9.5em; }
.modo { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.modo[data-modo="artifact"] { background: var(--accent-soft); color: var(--accent); }
.btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 5px; padding: 6px 12px; cursor: pointer;
  font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primario:hover { filter: brightness(1.07); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.abas { display: flex; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: 6px; }
.abas button { border: 0; background: transparent; padding: 5px 11px; border-radius: 4px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.abas button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--lift); }

/* ---------- layout */
.layout { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); }
.fila {
  position: sticky; top: var(--top-h); align-self: start; max-height: calc(100vh - var(--top-h)); overflow: auto;
  border-right: 1px solid var(--rule); padding: 14px 12px 24px 16px; display: flex; flex-direction: column; gap: 12px;
}
.filtros { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filtros select { width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 6px; }
.resumo { font-size: 13.5px; color: var(--ink-2); }
.resumo summary { cursor: pointer; }
.resumo p { margin: 6px 0 0; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.item {
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 8px 9px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center;
}
.item:hover { background: var(--surface); border-color: var(--rule); }
.item[aria-current="true"] { background: var(--surface); border-color: var(--accent); box-shadow: var(--lift); }
.item .pid { font: 500 12px var(--f-mono); color: var(--ink-2); }
.item .tit { grid-column: 1 / -1; font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-2); }
.dot[data-v="aceita"] { background: var(--ok); border-color: var(--ok); }
.dot[data-v="modificada"] { background: var(--mod); border-color: var(--mod); }
.dot[data-v="rejeitada"] { background: var(--bad); border-color: var(--bad); }
.dot[data-v="adiada"] { background: var(--wait); border-color: var(--wait); }
.bloco { display: flex; flex-direction: column; gap: 6px; }

.chip { font: 600 11px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px 3px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip.tipo { color: var(--ink); background: var(--surface-2); border-color: transparent; }
.chip.estr { color: var(--mod); background: var(--mod-soft); border-color: transparent; }
.chip.regra { font-family: var(--f-mono); text-transform: none; letter-spacing: 0; font-weight: 500; cursor: help; }

/* ---------- proposta */
main { min-width: 0; display: flex; flex-direction: column; }
.prop { padding: 22px clamp(16px, 3vw, 36px) 28px; display: flex; flex-direction: column; gap: 22px; max-width: 980px; width: 100%; }
.cab { display: flex; flex-direction: column; gap: 8px; }
.cab .linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.cab h1 { margin: 0; font: 600 clamp(22px, 2.6vw, 28px)/1.15 var(--f-cond); text-wrap: balance; }
.confianca { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.confianca i { display: inline-block; width: 14px; height: 6px; border-radius: 1px; background: var(--surface-2); }
.confianca i.on { background: var(--accent); }
section h2 { margin: 0 0 8px; }

.movs { display: flex; flex-direction: column; gap: 8px; }
.mov {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px;
}
.mov .seta { font-size: 20px; color: var(--accent); }
.grupo-ref { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.grupo-ref .mono { font-weight: 500; }
.grupo-ref span:last-child { font-size: 13.5px; overflow-wrap: anywhere; }
.extra { font-size: 14px; background: var(--surface); border: 1px dashed var(--rule); border-radius: 6px; padding: 10px 14px; }

.tabela-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
tr:last-child td { border-bottom: 0; }
th { font: 600 11.5px/1.2 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }
.cob td.ano, .cob th.ano { text-align: center; font-variant-numeric: tabular-nums; width: 11%; white-space: nowrap; }
.cob td.ano b { font-weight: 600; }
.cob td.mudou { background: var(--accent-soft); }
.cob td.vazio b { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--bad); color: var(--bad); }
.cob .antes { color: var(--ink-2); text-decoration: line-through; margin-right: 3px; }
.cob .setinha { color: var(--ink-2); margin-right: 3px; }

.texto { max-width: 68ch; }
.texto p { margin: 0; white-space: pre-wrap; }
.duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; }
.conflito { border: 1.5px solid var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 12px 14px; }
.conflito dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14px; }
.conflito dt { font-weight: 600; }
.conflito dd { margin: 0; }

.anos { display: flex; flex-direction: column; gap: 10px; }
.ano-cab { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.ano-cab strong { font: 600 17px var(--f-cond); font-variant-numeric: tabular-nums; }
.itens { color: var(--ink); }
.itens em { color: var(--ink-2); font-style: normal; }
td .destino { font-family: var(--f-mono); color: var(--accent); white-space: nowrap; }

/* ---------- decisão */
.decidir {
  position: sticky; bottom: 0; z-index: 5; margin-top: auto; background: var(--surface); border-top: 1px solid var(--rule);
  box-shadow: 0 -8px 22px rgb(23 32 29 / .07); padding: 12px clamp(16px, 3vw, 36px) 14px;
}
.decidir .grade { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 14px; align-items: start; max-width: 980px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.seg button { border: 1px solid var(--rule); background: var(--ground); border-radius: 5px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"][data-v="aceita"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.seg button[aria-pressed="true"][data-v="modificada"] { background: var(--mod-soft); border-color: var(--mod); color: var(--mod); }
.seg button[aria-pressed="true"][data-v="rejeitada"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.seg button[aria-pressed="true"][data-v="adiada"] { background: var(--wait-soft); border-color: var(--wait); color: var(--wait); }
#motivo { width: 100%; min-height: 62px; resize: vertical; border: 1px solid var(--rule); border-radius: 5px; background: var(--ground); padding: 7px 9px; }
.acoes { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.status { font-size: 12.5px; color: var(--ink-2); grid-column: 1 / -1; min-height: 1.2em; }
.status.erro { color: var(--bad); }
.status.ok { color: var(--ok); }
.editor { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; background: var(--mod-soft); border-radius: 6px; padding: 8px 10px; }
.editor label { display: grid; grid-template-columns: minmax(0, 1fr) 13em; gap: 8px; align-items: center; font-size: 13px; }
.editor input { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); padding: 4px 7px; font-family: var(--f-mono); }

/* ---------- regras */
.regras { padding: 22px clamp(16px, 3vw, 36px); display: flex; flex-direction: column; gap: 22px; max-width: 1040px; }
.legenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 20px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.legenda b { font-family: var(--f-mono); font-weight: 500; margin-right: 6px; color: var(--accent); }

.vazio-geral { padding: 48px 16px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.vazio-geral h1 { font: 600 26px var(--f-cond); margin: 0; }
.vazio-geral code { font-family: var(--f-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .fila { position: static; max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--rule); padding-inline: 16px; }
  .decidir .grade { grid-template-columns: 1fr; }
  .mov { grid-template-columns: 1fr; gap: 4px; }
  .mov .seta { transform: rotate(90deg); justify-self: start; }
  .editor label { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .item, .btn, .seg button { transition: background-color .12s, border-color .12s; }
}
</style>

<header class="top" id="top">
  <div class="brand"><strong>Mesa de Revisão</strong><span class="mono" id="onda-id">carregando onda…</span></div>
  <div class="progresso" aria-live="polite">
    <div class="barra" id="barra" role="img" aria-label="progresso das decisões"></div>
    <div class="contagem num" id="contagem"></div>
  </div>
  <div class="ferramentas">
    <div class="abas" role="group" aria-label="Vista">
      <button type="button" id="aba-propostas" aria-pressed="true">Propostas</button>
      <button type="button" id="aba-regras" aria-pressed="false">Regras e escopo</button>
    </div>
    <label class="campo" for="revisor"><span class="label">Revisor</span><input id="revisor" autocomplete="nickname" placeholder="seu nome"></label>
    <span class="modo" id="modo" data-modo="conectando">Conectando…</span>
    <button type="button" class="btn" id="exportar" hidden>Exportar decisoes.json</button>
  </div>
</header>

<div id="raiz"></div>

<script>
(() => {
  "use strict";
  const ANOS_PAD = ["1987", "1995", "2002", "2008", "2017"];
  const REGRAS = {
    R1: "Junção obrigatória", R2: "Máxima granularidade compatível", R3: "Sem distinção temporal artificial",
    R4: "Célula vazia é suspeita", R5: "Ausência estrutural só com evidência", R6: "Família analisada em conjunto",
    R7: "Não-contradição", R8: "Conservadorismo"
  };
  const VER = { aceita: "Aceitar", modificada: "Modificar", rejeitada: "Rejeitar", adiada: "Adiar" };
  const VER_PASSADO = { aceita: "aceita", modificada: "modificada", rejeitada: "rejeitada", adiada: "adiada" };
  const COR = { aceita: "var(--ok)", modificada: "var(--mod)", rejeitada: "var(--bad)", adiada: "var(--wait)" };
  const ESTRUTURAIS = new Set(["UNIR", "DIVIDIR", "CRIAR", "REGRA"]);

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } }
  };

  const S = { data: null, dec: {}, draft: {}, sel: null, vista: "propostas", fTipo: "", fEstado: "", modo: "conectando", db: null, armado: false, status: null };

  // ------------------------------------------------------------ dados
  async function carregar() {
    const q = new URLSearchParams(location.search);
    const urls = [];
    if (q.get("src")) urls.push(q.get("src"));
    urls.push("onda.json");
    const id = q.get("onda");
    if (id) {
      urls.push(`../harmonizacao/ondas/${id}/onda.json`);
      const branch = q.get("branch") || `onda/${id}`;
      urls.push(`https://raw.githubusercontent.com/arthurwelle/Harmoniza_Produtos/${branch}/harmonizacao/ondas/${id}/onda.json`);
    }
    for (const u of urls) {
      try {
        const r = await fetch(u, { cache: "no-store" });
        if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.propostas)) return j; }
      } catch (e) { /* tenta a próxima */ }
    }
    return null;
  }

  const anos = () => (S.data && S.data.anos) || ANOS_PAD;
  const chaveLocal = () => `hp-decisoes-${S.data.onda}`;
  const colecao = () => `ondas/${S.data.onda}/decisoes`;
  const prop = (pid) => S.data.propostas.find((p) => p.id === pid);

  function nomeGrupo(cod, p) {
    if (String(cod).startsWith("NOVO:")) {
      const g = (p && p.novos_grupos || {})[cod.slice(5)];
      return g ? `${g.nome} (grupo novo)` : "grupo novo";
    }
    const g = S.data.grupos && S.data.grupos[cod];
    return g ? g.nome : "grupo desconhecido";
  }

  // ------------------------------------------------------------ modo
  async function detectarModo() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return modoLocal();
    let db = null;
    try { db = await c.use("db"); } catch (e) { db = null; }
    if (!db) return modoLocal();
    S.db = db; S.modo = "artifact";
    try {
      db.collection(colecao()).onSnapshot((snap) => {
        const m = {};
        snap.docs.forEach((d) => { if (d.exists) m[d.id] = d.data(); });
        S.dec = m;
        pintarTopo(); pintarFila(); pintarStatus();
      }, (err) => {
        S.status = { tipo: "erro", txt: `Banco da página indisponível (${err.code}). Recarregue a página.` };
        pintarStatus();
      });
    } catch (e) {
      return modoLocal();
    }
    pintarTudo();
  }

  function modoLocal() {
    S.modo = "local";
    S.dec = store.get(chaveLocal(), {});
    pintarTudo();
  }

  async function gravar(pid, corpo) {
    const doc = { pid, onda: S.data.onda, ...corpo, ts: new Date().toISOString() };
    if (S.modo === "artifact") {
      await S.db.collection(colecao()).doc(pid).set(doc);
    } else if (S.modo === "local") {
      S.dec = { ...S.dec, [pid]: doc };
      store.set(chaveLocal(), S.dec);
    } else {
      throw { code: "conectando" };
    }
    S.dec = { ...S.dec, [pid]: doc };
  }

  // ------------------------------------------------------------ pintura
  function filtradas() {
    return S.data.propostas.filter((p) => {
      if (S.fTipo && p.tipo !== S.fTipo) return false;
      const v = S.dec[p.id] && S.dec[p.id].veredito;
      if (S.fEstado === "pendente") return !v;
      if (S.fEstado && v !== S.fEstado) return false;
      return true;
    });
  }

  function pintarTopo() {
    $("#onda-id").textContent = S.data.onda;
    const total = S.data.propostas.length;
    const c = { aceita: 0, modificada: 0, rejeitada: 0, adiada: 0 };
    S.data.propostas.forEach((p) => { const v = S.dec[p.id] && S.dec[p.id].veredito; if (v in c) c[v]++; });
    const feitas = c.aceita + c.modificada + c.rejeitada + c.adiada;
    $("#barra").innerHTML = Object.keys(c).map((k) => `<span style="width:${(100 * c[k] / total).toFixed(2)}%;background:${COR[k]}"></span>`).join("");
    $("#barra").setAttribute("aria-label", `${feitas} de ${total} propostas decididas`);
    $("#contagem").innerHTML = `<span><b>${feitas}</b> de ${total} decididas</span>` +
      Object.keys(c).filter((k) => c[k]).map((k) => `<span>${VER_PASSADO[k]} <b>${c[k]}</b></span>`).join("");
    const modo = $("#modo");
    modo.dataset.modo = S.modo;
    modo.textContent = S.modo === "artifact" ? "Decisões gravadas no banco da página"
      : S.modo === "local" ? "Decisões neste navegador — exporte ao terminar" : "Conectando…";
    $("#exportar").hidden = S.modo !== "local";
    $("#aba-propostas").setAttribute("aria-pressed", String(S.vista === "propostas"));
    $("#aba-regras").setAttribute("aria-pressed", String(S.vista === "regras"));
  }

  function pintarFila() {
    const ul = $("#lista");
    if (!ul) return;
    const ps = filtradas();
    ul.innerHTML = ps.length ? ps.map((p) => {
      const v = S.dec[p.id] && S.dec[p.id].veredito;
      return `<li><button type="button" class="item" data-pid="${esc(p.id)}" aria-current="${p.id === S.sel}">
        <span class="pid">${esc(p.id)}</span>
        <span><span class="chip tipo">${esc(p.tipo)}</span>${ESTRUTURAIS.has(p.tipo) ? ' <span class="chip estr">estrutural</span>' : ""}</span>
        <span class="dot" data-v="${esc(v || "")}" title="${v ? esc(VER_PASSADO[v]) : "pendente"}"></span>
        <span class="tit">${esc(p.titulo || p.motivo_ia || "")}</span>
      </button></li>`;
    }).join("") : `<li class="muted" style="padding:8px">Nenhuma proposta com esses filtros.</li>`;
    const pend = ps.filter((p) => !(S.dec[p.id] && S.dec[p.id].veredito) && !ESTRUTURAIS.has(p.tipo));
    const b = $("#bloco");
    b.disabled = !pend.length || S.modo === "conectando";
    b.textContent = S.armado ? `Confirmar: aceitar ${pend.length}` : `Aceitar ${pend.length} pendentes não estruturais`;
    b.classList.toggle("primario", S.armado);
  }

  function celulaCob(a, b) {
    const mudou = a !== b;
    return `<td class="ano${b === 0 ? " vazio" : ""}${mudou ? " mudou" : ""}" title="${a} → ${b} células">` +
      (mudou ? `<span class="antes">${a}</span><span class="setinha" aria-hidden="true">→</span>` : "") + `<b>${b}</b></td>`;
  }

  function pintarProposta() {
    const alvo = $("#prop");
    const p = prop(S.sel);
    if (!p) { alvo.innerHTML = `<div class="prop"><p class="muted">Escolha uma proposta na fila.</p></div>`; $("#decidir").hidden = true; return; }
    $("#decidir").hidden = false;
    const nivel = { ALTA: 3, MEDIA: 2, "MÉDIA": 2, BAIXA: 1 }[String(p.confianca || "").toUpperCase()] || 0;
    const movs = p.movimentos || [];
    const destino = {};
    movs.forEach((m) => m.celulas.forEach((c) => { destino[c] = m.para; }));
    const ctx = p.contexto_celulas || [];
    const deDe = (m) => [...new Set(ctx.filter((c) => m.celulas.includes(c.cel)).map((c) => c.grupo))];

    const movHtml = movs.map((m) => {
      const origens = deDe(m);
      return `<div class="mov">
        <div class="grupo-ref"><span class="label">${m.celulas.length} ${m.celulas.length === 1 ? "célula" : "células"} de</span>
          ${origens.map((g) => `<span><span class="mono">${esc(g)}</span> ${esc(nomeGrupo(g, p))}</span>`).join("") || '<span class="muted">—</span>'}</div>
        <span class="seta" aria-hidden="true">→</span>
        <div class="grupo-ref"><span class="label">para</span><span class="mono">${esc(m.para)}</span><span>${esc(nomeGrupo(m.para, p))}</span></div>
      </div>`;
    }).join("");

    const extras = [];
    if (p.extinguir && p.extinguir.length) extras.push(`Extingue ${p.extinguir.map((g) => `<span class="mono">${esc(g)}</span> ${esc(nomeGrupo(g, p))}`).join(", ")}.`);
    if (p.renomear) Object.entries(p.renomear).forEach(([g, r]) => extras.push(`Renomeia <span class="mono">${esc(g)}</span> “${esc(nomeGrupo(g, p))}” para “${esc(r.nome || "")}”${r.nivel2 ? ` (nível 2: ${esc(r.nivel2)})` : ""}.`));
    if (p.regra_nova) {
      const r = p.regra_nova;
      extras.push(`<span class="label">Regra nova · ${esc(r.tipo)}</span><br>${esc(r.enunciado)}` +
        `${r.grupos && r.grupos.length ? `<br><span class="muted">grupos ${esc(r.grupos.join(", "))}</span>` : ""}` +
        `${r.anos && r.anos.length ? ` <span class="muted">· anos ${esc(r.anos.join(", "))}</span>` : ""}`);
    }
    if (p.revoga && p.revoga.length) extras.push(`Revoga ${p.revoga.map((x) => `<span class="mono">${esc(x)}</span>`).join(", ")}.`);
    if (!movs.length && !extras.length) extras.push(p.tipo === "MANTER" ? "Nenhuma mudança: a classificação atual das células analisadas fica como está."
      : p.tipo === "REVISAR" ? "Nenhuma mudança agora. Aceitar abre uma pendência para discussão do grupo." : "Sem movimentos.");

    const antes = p.cobertura_antes || {};
    const depois = p.cobertura_depois || {};
    const grupos = [...new Set([...Object.keys(antes), ...Object.keys(depois)])];
    const cobHtml = grupos.length ? `<div class="tabela-wrap"><table class="cob">
      <thead><tr><th>Grupo</th>${anos().map((a) => `<th class="ano">${a}</th>`).join("")}</tr></thead>
      <tbody>${grupos.map((g) => {
        const A = antes[g] || anos().map(() => 0), D = depois[g] || anos().map(() => 0);
        return `<tr><td><span class="mono">${esc(g)}</span> ${esc(nomeGrupo(g, p))}</td>${anos().map((_, i) => celulaCob(A[i], D[i])).join("")}</tr>`;
      }).join("")}</tbody></table></div>` : `<p class="muted">Sem grupos afetados.</p>`;

    const semCelulas = anos().filter((a) => !ctx.some((c) => c.ano === a));
    const anosHtml = (semCelulas.length && ctx.length ? `<p class="muted" style="margin:0">Sem células desta proposta em ${semCelulas.join(", ")}.</p>` : "") +
      (!ctx.length ? `<p class="muted" style="margin:0">Proposta sem células (regra ou renomeação).</p>` : "") +
      anos().filter((a) => ctx.some((c) => c.ano === a)).map((a) => {
      const rows = ctx.filter((c) => c.ano === a);
      return `<div><div class="ano-cab"><strong>${a}</strong><span class="muted num">${rows.length} ${rows.length === 1 ? "célula" : "células"}</span></div>
        <div class="tabela-wrap"><table>
          <thead><tr><th>Código</th><th>Quadro</th><th>Grupo atual</th><th>Vai para</th><th>Itens</th></tr></thead>
          <tbody>${rows.map((c) => `<tr>
            <td class="mono">${esc(c.codigo)}</td><td class="mono">${esc(c.quadro)}</td>
            <td><span class="mono">${esc(c.grupo)}</span></td>
            <td>${destino[c.cel] ? `<span class="destino">${esc(destino[c.cel])}</span>` : '<span class="muted">fica</span>'}</td>
            <td class="itens">${esc(c.itens.join(" · "))}${c.n_itens > c.itens.length ? ` <em>(+${c.n_itens - c.itens.length})</em>` : ""}</td>
          </tr>`).join("")}</tbody></table></div></div>`;
    }).join("");

    const conf = p.conflito ? `<section class="conflito"><h2 class="label" style="color:var(--bad)">Conflito com decisão anterior (R7)</h2><dl>
      <dt>Decisão anterior</dt><dd>${esc(p.conflito.decisao_anterior)}</dd>
      <dt>Nova evidência</dt><dd>${esc(p.conflito.nova_evidencia)}</dd>
      <dt>Solução</dt><dd>${esc(p.conflito.solucao)}</dd></dl></section>` : "";

    alvo.innerHTML = `<article class="prop">
      <div class="cab">
        <div class="linha"><span class="mono muted">${esc(p.id)}</span><span class="chip tipo">${esc(p.tipo)}</span>
          ${ESTRUTURAIS.has(p.tipo) ? '<span class="chip estr" title="Exige ADR e aprovação de outro membro no PR">estrutural</span>' : ""}
          <span class="confianca">confiança <i class="${nivel >= 1 ? "on" : ""}"></i><i class="${nivel >= 2 ? "on" : ""}"></i><i class="${nivel >= 3 ? "on" : ""}"></i> ${esc(p.confianca || "")}</span>
          ${(p.regras_ref || []).map((r) => `<span class="chip regra" title="${esc(REGRAS[r] || r)}">${esc(r)}</span>`).join("")}
        </div>
        <h1>${esc(p.titulo || p.tipo)}</h1>
      </div>
      ${conf}
      <section><h2 class="label">O que muda</h2><div class="movs">${movHtml}${extras.map((e) => `<div class="extra">${e}</div>`).join("")}</div></section>
      <section><h2 class="label">Células por ano, antes → depois</h2>${cobHtml}</section>
      <div class="duas">
        <section class="texto"><h2 class="label">Por que (IA)</h2><p>${esc(p.motivo_ia)}</p></section>
        <section class="texto"><h2 class="label">Evidência</h2><p>${esc(p.evidencia || "—")}</p></section>
      </div>
      ${p.impacto ? `<section class="texto"><h2 class="label">Impacto</h2><p>${esc(p.impacto)}</p></section>` : ""}
      <section><h2 class="label">Células analisadas</h2><div class="anos">${anosHtml}</div></section>
    </article>`;
    pintarDecisao();
  }

  function rascunho(p) {
    if (!S.draft[p.id]) {
      const d = S.dec[p.id];
      S.draft[p.id] = d ? { veredito: d.veredito, motivo: d.motivo || "", movimentos: d.movimentos || null }
        : { veredito: "", motivo: "", movimentos: null };
    }
    return S.draft[p.id];
  }

  function pintarDecisao() {
    const p = prop(S.sel);
    if (!p) return;
    const r = rascunho(p);
    const movs = r.movimentos || (p.movimentos || []).map((m) => ({ celulas: [...m.celulas], para: m.para }));
    const podeModificar = (p.movimentos || []).length > 0;
    const exigeMotivo = r.veredito && r.veredito !== "aceita";
    $("#decidir").innerHTML = `<div class="grade">
      <div class="seg" role="group" aria-label="Veredito">
        ${Object.keys(VER).map((v) => `<button type="button" data-v="${v}" aria-pressed="${r.veredito === v}" ${v === "modificada" && !podeModificar ? "disabled title=\"Só propostas com movimentos\"" : ""}>${VER[v]}</button>`).join("")}
      </div>
      <label for="motivo" style="display:flex;flex-direction:column;gap:4px">
        <span class="label">Motivo ${exigeMotivo ? "(obrigatório)" : "(opcional ao aceitar)"}</span>
        <textarea id="motivo" placeholder="${r.veredito === "rejeitada" ? "Por que a classificação atual é melhor? Cite célula, ano ou regra." : r.veredito === "adiada" ? "O que falta saber para decidir?" : r.veredito === "modificada" ? "O que mudou em relação à proposta e por quê?" : "Concordância com ressalva, contexto para o grupo…"}">${esc(r.motivo)}</textarea>
      </label>
      <div class="acoes">
        <button type="button" class="btn primario" id="salvar" ${S.modo === "conectando" ? "disabled" : ""}>Salvar decisão</button>
        <span class="muted" style="font-size:12px">atalhos: j / k navegam</span>
      </div>
      ${r.veredito === "modificada" ? `<div class="editor"><span class="label">Destino de cada movimento</span>
        ${movs.map((m, i) => `<label for="mov-${i}"><span class="mono" style="overflow-wrap:anywhere">${esc(m.celulas.join(", "))}</span>
          <input id="mov-${i}" data-mov="${i}" list="grupos-lista" value="${esc(m.para)}"></label>`).join("")}</div>` : ""}
      <div class="status" id="status" role="status"></div>
    </div>`;
    if (r.veredito === "modificada" && !r.movimentos) r.movimentos = movs;
    pintarStatus();
  }

  function pintarStatus() {
    const el = $("#status");
    if (!el || !S.data) return;
    const d = S.dec[S.sel];
    el.className = "status";
    if (S.status && S.status.pid === S.sel || S.status && !S.status.pid) {
      el.textContent = S.status.txt;
      el.classList.add(S.status.tipo);
      return;
    }
    el.textContent = d ? `Salva como ${VER_PASSADO[d.veredito]} por ${d.revisor || "?"} em ${new Date(d.ts).toLocaleString("pt-BR")}.` : "Pendente.";
  }

  function pintarRegras() {
    const reg = S.data.regras_ativas || [];
    const e = S.data.escopo || {};
    $("#raiz").innerHTML = `<div class="regras">
      <section><h2 class="label">Escopo desta onda</h2>
        <p style="margin:0">Tipo <b>${esc(e.tipo || "—")}</b> · autor ${esc(e.autor || "—")} · aberta em ${esc(e.aberta_em || "—")}</p>
        <p style="margin:4px 0 0" class="muted">Grupos: <span class="mono">${esc((e.grupos || []).join(", ") || "—")}</span> · células extras: <span class="mono">${esc((e.celulas || []).join(", ") || "—")}</span> · pendências: <span class="mono">${esc((e.pendencias || []).join(", ") || "—")}</span></p>
        ${S.data.resumo ? `<p class="texto" style="margin-top:10px">${esc(S.data.resumo)}</p>` : ""}
      </section>
      <section><h2 class="label">Constituição (regras de decisão)</h2>
        <ul class="legenda">${Object.entries(REGRAS).map(([k, v]) => `<li><b>${k}</b>${v}</li>`).join("")}</ul></section>
      <section><h2 class="label">Regras registradas em ondas anteriores (${reg.length})</h2>
        ${reg.length ? `<div class="tabela-wrap"><table><thead><tr><th>Id</th><th>Tipo</th><th>Enunciado</th><th>Grupos</th><th>Anos</th></tr></thead>
        <tbody>${reg.map((r) => `<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.tipo)}</td><td>${esc(r.enunciado)}</td><td class="mono">${esc(r.grupos)}</td><td class="mono">${esc(r.anos)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted" style="margin:0">Nenhuma regra ativa ainda. Cada regra aceita numa onda passa a restringir as seguintes.</p>`}
      </section></div>`;
  }

  function pintarTudo() {
    if (!S.data) return;
    pintarTopo();
    if (S.vista === "regras") { pintarRegras(); medirTopo(); return; }
    const tipos = [...new Set(S.data.propostas.map((p) => p.tipo))];
    $("#raiz").innerHTML = `<div class="layout">
      <aside class="fila" aria-label="Fila de propostas">
        ${S.data.resumo ? `<details class="resumo"><summary class="label">Diagnóstico da onda</summary><p>${esc(S.data.resumo)}</p></details>` : ""}
        <div class="filtros">
          <label for="f-tipo" class="bloco"><span class="label">Tipo</span><select id="f-tipo"><option value="">todos</option>${tipos.map((t) => `<option ${t === S.fTipo ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
          <label for="f-estado" class="bloco"><span class="label">Estado</span><select id="f-estado">
            ${[["", "todos"], ["pendente", "pendentes"], ["aceita", "aceitas"], ["modificada", "modificadas"], ["rejeitada", "rejeitadas"], ["adiada", "adiadas"]]
              .map(([v, t]) => `<option value="${v}" ${v === S.fEstado ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        </div>
        <button type="button" class="btn" id="bloco"></button>
        <ul class="lista" id="lista"></ul>
      </aside>
      <main><div id="prop"></div><div class="decidir" id="decidir"></div></main>
    </div>
    <datalist id="grupos-lista">${Object.entries(S.data.grupos || {}).filter(([, g]) => g.status === "ativo")
      .map(([c, g]) => `<option value="${esc(c)}">${esc(g.nome)}</option>`).join("")}</datalist>`;
    pintarFila();
    pintarProposta();
    medirTopo();
  }

  function medirTopo() {
    document.documentElement.style.setProperty("--top-h", `${$("#top").offsetHeight}px`);
  }

  // ------------------------------------------------------------ ações
  function selecionar(pid) {
    S.sel = pid; S.armado = false;
    if (S.status && S.status.pid !== pid) S.status = null;
    pintarFila(); pintarProposta();
    const main = $("#prop");
    if (main) main.scrollIntoView({ block: "start", behavior: "auto" });
  }

  function proximaPendente() {
    const ps = filtradas();
    const i = ps.findIndex((p) => p.id === S.sel);
    const depois = [...ps.slice(i + 1), ...ps.slice(0, i + 1)];
    const alvo = depois.find((p) => !(S.dec[p.id] && S.dec[p.id].veredito));
    return alvo ? alvo.id : null;
  }

  async function salvar() {
    const p = prop(S.sel);
    const r = rascunho(p);
    const revisor = $("#revisor").value.trim();
    const falha = (txt) => { S.status = { pid: p.id, tipo: "erro", txt }; pintarStatus(); };
    if (!revisor) { $("#revisor").focus(); return falha("Informe seu nome no campo Revisor antes de salvar."); }
    if (!r.veredito) return falha("Escolha Aceitar, Modificar, Rejeitar ou Adiar.");
    if (r.veredito !== "aceita" && !r.motivo.trim()) { $("#motivo").focus(); return falha("Escreva o motivo: é obrigatório para modificar, rejeitar ou adiar."); }
    if (r.veredito === "modificada" && (!r.movimentos || r.movimentos.some((m) => !m.para.trim()))) return falha("Preencha o destino de todos os movimentos.");
    const corpo = { veredito: r.veredito, motivo: r.motivo.trim(), revisor, movimentos: r.veredito === "modificada" ? r.movimentos : null };
    $("#salvar").disabled = true;
    try {
      await gravar(p.id, corpo);
      S.status = { pid: p.id, tipo: "ok", txt: `Salva como ${VER_PASSADO[r.veredito]}.` };
      delete S.draft[p.id];
      pintarTopo(); pintarFila(); pintarStatus();
      const prox = proximaPendente();
      if (prox) setTimeout(() => selecionar(prox), 450);
    } catch (e) {
      falha(e && e.code === "quota_exceeded" ? "O banco da página está cheio; avise quem publicou." : `Não salvou (${(e && e.code) || "erro"}). Tente de novo.`);
    } finally {
      const b = $("#salvar"); if (b) b.disabled = false;
    }
  }

  async function aceitarEmBloco() {
    const pend = filtradas().filter((p) => !(S.dec[p.id] && S.dec[p.id].veredito) && !ESTRUTURAIS.has(p.tipo));
    if (!S.armado) { S.armado = true; pintarFila(); return; }
    S.armado = false;
    const revisor = $("#revisor").value.trim();
    if (!revisor) { $("#revisor").focus(); S.status = { tipo: "erro", txt: "Informe seu nome no campo Revisor antes de aceitar em bloco." }; pintarStatus(); pintarFila(); return; }
    let ok = 0;
    for (const p of pend) {
      try { await gravar(p.id, { veredito: "aceita", motivo: "", revisor, movimentos: null }); ok++; } catch (e) { break; }
    }
    S.status = { tipo: ok === pend.length ? "ok" : "erro", txt: `${ok} de ${pend.length} propostas aceitas em bloco.` };
    pintarTopo(); pintarFila(); pintarStatus();
  }

  function exportar() {
    const decisoes = {};
    Object.entries(S.dec).forEach(([pid, d]) => { decisoes[pid] = { veredito: d.veredito, motivo: d.motivo, revisor: d.revisor, ts: d.ts, movimentos: d.movimentos || null }; });
    const blob = new Blob([JSON.stringify({ onda: S.data.onda, modo: "local", exportado_em: new Date().toISOString(), decisoes }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "decisoes.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t || !S.data) return;
    if (t.classList.contains("item")) return selecionar(t.dataset.pid);
    if (t.id === "bloco") return aceitarEmBloco();
    if (t.id === "salvar") return salvar();
    if (t.id === "exportar") return exportar();
    if (t.id === "aba-propostas" || t.id === "aba-regras") { S.vista = t.id === "aba-regras" ? "regras" : "propostas"; return pintarTudo(); }
    if (t.dataset.v && t.closest(".seg")) {
      const r = rascunho(prop(S.sel));
      r.veredito = t.dataset.v;
      S.status = null;
      pintarDecisao();
      const m = $("#motivo"); if (m && r.veredito !== "aceita") m.focus();
    }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (!S.data) return;
    if (t.id === "motivo") rascunho(prop(S.sel)).motivo = t.value;
    if (t.dataset.mov !== undefined) {
      const r = rascunho(prop(S.sel));
      r.movimentos[Number(t.dataset.mov)].para = t.value.trim();
    }
    if (t.id === "revisor") store.set("hp-revisor", t.value.trim());
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "f-tipo") { S.fTipo = t.value; S.armado = false; pintarFila(); }
    if (t.id === "f-estado") { S.fEstado = t.value; S.armado = false; pintarFila(); }
  });
  document.addEventListener("keydown", (ev) => {
    if (!S.data || S.vista !== "propostas" || ev.target.closest("input, textarea, select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key !== "j" && ev.key !== "k") return;
    const ps = filtradas();
    const i = ps.findIndex((p) => p.id === S.sel);
    const alvo = ps[Math.min(ps.length - 1, Math.max(0, i + (ev.key === "j" ? 1 : -1)))];
    if (alvo) selecionar(alvo.id);
  });
  window.addEventListener("resize", medirTopo);

  // ------------------------------------------------------------ início
  (async () => {
    $("#revisor").value = store.get("hp-revisor", "");
    S.data = await carregar();
    if (!S.data) {
      $("#onda-id").textContent = "nenhuma onda carregada";
      $("#modo").hidden = true;
      $("#raiz").innerHTML = `<div class="vazio-geral">
        <h1>Nenhuma onda para revisar</h1>
        <p>Esta página abre as propostas de uma onda de harmonização. Use o endereço com o identificador da onda:</p>
        <p><code>revisao/?onda=2026-09-12_arthur_cirurgia</code></p>
        <p class="muted">A onda precisa ter <code>onda.json</code> gerado por <code>hp_onda.py propostas</code> e a branch <code>onda/&lt;id&gt;</code> enviada ao GitHub.</p>
      </div>`;
      return;
    }
    S.sel = (S.data.propostas[0] || {}).id || null;
    pintarTudo();
    detectarModo();
  })();
})();
</script>
